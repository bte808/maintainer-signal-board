name: Security hardening
description: Propose or track non-emergency security and privacy improvements.
title: "[Security hardening]: "
labels: ["security", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post secrets, exploit details, private repository names, or private organization names here. For active vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: area
    attributes:
      label: Area
      description: What part of the project should be hardened?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Local-first privacy
        - Imported JSON handling
        - Generated Markdown brief
        - CSV export
        - Static hosting
        - Dependency or supply chain
        - Documentation or templates
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: Describe the risk with synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: Proposed mitigation
  - type: checkboxes
    id: checks
    attributes:
      label: Scope check
      options:
        - label: This is hardening, not an active vulnerability disclosure.
          required: true
        - label: I used synthetic data and removed sensitive details.
          required: true
